name: Build and Deploy Sphinx Documentation

on:
  push:
    branches:
      - "master" # Trigger on version tags
  workflow_dispatch:

jobs:
  build-docs:
    # This job builds the documentation and deploys it to GitHub Pages
    # it is automatically triggered by the update-version job via the commit
    # made in the update-version job that contains the commit message
    # '[bot] Update version to <version>'
    #
    # It can also be run manually (workflow_dispatch) as a dry run: everything
    # runs except the final "Deploy to GitHub Pages" step, so the pipeline can
    # be verified without actually publishing docs.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[bot] Update version to'))
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Set up Python
      uses: ./.github/actions/setup-python
      with:
        python-version: '3.x'  # Specify Python version as needed

    - name: Build current documentation
      run: |
        git fetch --tags
        echo "Latest tag: $latest_tag"
        git checkout "$latest_tag"
        pip install -e .
        pip install -e ".[doc]"
        
        cd docs

        make html
        mkdir -p "../build/html/$latest_tag"
        cp -r build/html/* "../build/html/$latest_tag/"
        rm -rf build/html
        git stash

    - name: Install dependencies
      run: |
        git checkout master  
        python -m pip install --upgrade pip
        pip install -e .
        pip install -e .[doc]

    - name: Build current documentation
      run: |
        cd docs
        make html
        cp -r build/html/* ../build/html/

    - name: Deploy to GitHub Pages
      if: github.event_name != 'workflow_dispatch'
      uses: peaceiris/actions-gh-pages@1ef5a1b1df4c63fe21a2242edbee6cac921ece01 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/html/  # Adjusted path since we're copying docs to root build directory
