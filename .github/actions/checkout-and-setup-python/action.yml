name: 'Checkout and setup Python'
description: 'Checkout the repository and optionally set up Python, using pinned action SHAs'
inputs:
  python-version:
    description: 'Python version to pass to actions/setup-python. Leave empty to skip the setup-python step entirely.'
    required: false
    default: ''
  cache:
    description: 'Value forwarded to actions/setup-python cache input.'
    required: false
    default: ''
  fetch-depth:
    description: 'Value forwarded to actions/checkout fetch-depth input.'
    required: false
    default: '1'
  ref:
    description: 'Value forwarded to actions/checkout ref input. Leave empty to use the default ref.'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}
    - name: Set up Python
      if: ${{ inputs.python-version != '' }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache }}
